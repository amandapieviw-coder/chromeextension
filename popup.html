<!DOCTYPE html>
<html>
<head>
  <title>Twitter Thread Poster</title>
  <style>
    body {
      width: 350px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    h1 {
      font-size: 18px;
      margin-top: 0;
    }
    textarea {
      width: 100%;
      height: 200px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      background-color: #1DA1F2;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #0c85d0;
    }
  </style>
</head>
<body>
  <h1>Twitter Thread Poster</h1>
  <textarea id="thread-content" placeholder="Write your awesome thread here..."></textarea>
  <button id="post-thread-button">Post Thread</button>
  <script src="popup.js"></script>
</body>
</html>
